# Keeps the pnpm store cache saved under main, where every pull request can
# restore it. The CI gate (ci.yml) runs only on pull requests, and a cache a
# pull request saves is visible to that pull request alone; setup-node
# restores by exact key only, so without a run on main every pull request
# after a lockfile change would install from the network. This job only
# installs: setup-node saves the store when its key is new and skips the
# save on a hit. The setup steps match ci.yml so both compute the same key.
name: pnpm cache

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pnpm-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm pnpm cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json's "packageManager" field.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Must run after pnpm/action-setup: the pnpm cache needs pnpm on PATH.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Tree-sitter grammars may fall back to a node-gyp build, which runs
      # `python`.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install
        run: pnpm install --frozen-lockfile
