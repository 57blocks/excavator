# Build, self-test and (on a release trigger) push the Excavator runner
# image. See openspec/changes/runner-image/design.md D6 for the decisions
# this workflow implements verbatim; this is the repository's only workflow.
#
# All three triggers run the exact same flow (test -> image -> push): a tag
# push or a manual dispatch is a release candidate, and a PR touching
# deploy-relevant files is the only place that flow can be exercised before
# merge, since GitHub only allows workflow_dispatch on the default branch.
name: Runner image

on:
  push:
    tags:
      - 'runner-v*'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/runner-image.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

# Least privilege at the workflow level; only the push job escalates to
# request an OIDC token (design D6: "第三方 action 一律按 commit SHA 钉住").
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Repository three-piece gate (design D6 step 1): the same commands
  # AGENTS.md documents as the repo's own build/test contract.
  # ---------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/skill/excavator/test_prompt_evidence_sections.test.mjs proves the
      # UA prompt files are only ever appended to by reading them as of the
      # `excavator-v2` branch, and fails (by design, not skips) when that ref
      # is missing. actions/checkout fetches only the triggering ref, so fetch
      # the baseline explicitly.
      - name: Fetch prompt baseline ref
        run: git fetch --no-tags --depth=1 origin +refs/heads/excavator-v2:refs/remotes/origin/excavator-v2

      # Reads the pnpm version straight from package.json's "packageManager"
      # field (no `version:` input) so this workflow can never drift from
      # the version the repo itself pins.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Must run after pnpm/action-setup: actions/setup-node's pnpm cache
      # needs pnpm already on PATH to resolve the cache key.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Some tree-sitter grammar packages fall back to a node-gyp source
      # build (see design D2/context), which shells out to `python`, not
      # `python3`. setup-python provides both on PATH.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install, build, test
        run: pnpm install --frozen-lockfile && pnpm -r build && pnpm test


  # ---------------------------------------------------------------------
  # Build the linux/amd64 image, self-test it, and — only on a release
  # trigger with the repo's ECR variables set — push that same tested
  # image (design D6). AWS hosts are x86 by default; arm64 (Graviton)
  # would be one more job on a native `ubuntu-24.04-arm` runner.
  # ---------------------------------------------------------------------
  image:
    name: Image (linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image's OCI revision label must match the content actually
      # built.
      - name: Assert clean checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::checkout is not clean; the image commit label would not match its content" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Resolve checked-out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            EXCAVATOR_COMMIT=${{ steps.commit.outputs.sha }}
          tags: excavator-runner-image:ci
          cache-from: type=gha,scope=runner-image-linux-amd64
          cache-to: type=gha,mode=max,scope=runner-image-linux-amd64

      - name: Self-test
        run: docker run --rm --entrypoint excavator-selftest excavator-runner-image:ci

      # Eligibility = (tag push OR workflow_dispatch) AND all four repo
      # variables set. Values come in through env:, never interpolated
      # directly into the script.
      - name: Decide push eligibility
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VAR_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          VAR_ECR_REGION: ${{ vars.ECR_REGION }}
          VAR_ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VAR_AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          reasons=()
          if [[ "$EVENT_NAME" != "workflow_dispatch" && ! ( "$EVENT_NAME" == "push" && "$REF" == refs/tags/runner-v* ) ]]; then
            reasons+=("not a release trigger (event=$EVENT_NAME, ref=$REF)")
          fi
          missing=()
          [[ -z "$VAR_AWS_ACCOUNT_ID" ]] && missing+=("AWS_ACCOUNT_ID")
          [[ -z "$VAR_ECR_REGION" ]] && missing+=("ECR_REGION")
          [[ -z "$VAR_ECR_REPOSITORY" ]] && missing+=("ECR_REPOSITORY")
          [[ -z "$VAR_AWS_ROLE_ARN" ]] && missing+=("AWS_ROLE_ARN")
          if [[ ${#missing[@]} -gt 0 ]]; then
            reasons+=("missing repository variable(s): ${missing[*]}")
          fi
          if [[ ${#reasons[@]} -eq 0 ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            joined=$(IFS='; '; echo "${reasons[*]}")
            echo "reason=$joined" >> "$GITHUB_OUTPUT"
          fi

      - name: Report push skipped
        if: steps.decide.outputs.eligible != 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "push skipped: $REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: steps.decide.outputs.eligible == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Log in to Amazon ECR
        if: steps.decide.outputs.eligible == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      # Pushes the exact image that just passed the self-test. ECR tag
      # immutability is a DevOps-side repository setting.
      - name: Push tested image
        if: steps.decide.outputs.eligible == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          tag="$REGISTRY/$REPOSITORY:$(jq -r .version package.json)-${COMMIT:0:8}"
          docker tag excavator-runner-image:ci "$tag"
          docker push "$tag"
          echo "pushed image tag: $tag" >> "$GITHUB_STEP_SUMMARY"
