# Checks the text each pull request brings into the repository (added
# lines, commit messages, authors, paths, title, branch name and body)
# against two name lists that live only in this repository's secrets
# (openspec change ci-merge-gate, design D2-D6). It fails when a list is
# unavailable, so a pull request from a fork, which gets no secrets, fails
# here and is reopened from a branch of this repository. Editing the title or
# body scans again.
name: Privacy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, so the head and the base branch are both present.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The lists come in through the environment and are written to files,
      # never spliced into the script. The title, branch name and body are
      # read when the job runs, not taken from the event, so a re-run or a
      # later edit scans the current text and none of it is printed in the
      # log. A manual run scans its branch's open pull request, if any.
      - name: Scan
        env:
          PRIVACY_NAMES: ${{ secrets.PRIVACY_NAMES }}
          PRIVACY_CORPUS: ${{ secrets.PRIVACY_CORPUS }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          dir="$RUNNER_TEMP/privacy"
          mkdir -p "$dir"
          printf '%s\n' "$PRIVACY_NAMES" > "$dir/names"
          printf '%s\n' "$PRIVACY_CORPUS" > "$dir/corpus"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          fi
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,headRefName,body --jq '.title, .headRefName, .body' > "$dir/pull-request"
          else
            printf '%s\n' "$GITHUB_REF_NAME" > "$dir/pull-request"
          fi
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          node scripts/ci/privacy-scan.mjs "$base" "$HEAD_SHA" "$dir/names" "$dir/corpus" "$dir/pull-request"
