<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; worker-src blob:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Excavator View</title>
  </head>
  <body>
    <div id="root" data-excavator-view="loading" data-errors="0" data-csp-violations="0"></div>
    <script>
      // Count page errors and CSP violations from the very first moment, for
      // the file:// smoke check (scripts/view-smoke.mjs reads these attributes).
      (function () {
        var root = document.getElementById('root');
        var c = (window.__excavatorViewCounters = window.__excavatorViewCounters || { errors: 0, csp: 0 });
        function error() {
          c.errors += 1;
          root.setAttribute('data-errors', String(c.errors));
        }
        window.addEventListener('error', error);
        window.addEventListener('unhandledrejection', error);
        document.addEventListener('securitypolicyviolation', function () {
          c.csp += 1;
          root.setAttribute('data-csp-violations', String(c.csp));
        });
      })();
    </script>
    <script type="text/plain" id="excavator-view-data"></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
